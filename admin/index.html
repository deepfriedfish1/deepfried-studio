<html>
<head>

<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
  (function() {
    const hash = window.location.hash;
    // Проверяем, есть ли в адресе токен для подтверждения, восстановления и т.д.
    if (hash && (hash.includes('_token=') || hash.includes('access_token='))) {
      // Перенаправляем на страницу /admin, сохраняя хеш
      window.location.href = '/admin' + hash;
    }
  })();
</script>
