backend:
  name: github
  repo: deepfriedfish1/deepfried-studio
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "services"
    label: "Услуги"
    folder: "src/content/services"
    create: true
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Иконка (CSS класс FontAwesome)", name: "icon", widget: "string", default: "fas fa-code" }

  - name: "portfolio"
    label: "Портфолио"
    folder: "src/content/portfolio"
    create: true
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Категория", name: "category", widget: "select", options: ["web", "shop", "app"] }
      - { label: "Описание", name: "description", widget: "text" }
      - { label: "Изображение", name: "image", widget: "image" }

  - name: "team"
    label: "Команда"
    folder: "src/content/team"
    create: true
    fields:
      - { label: "Имя", name: "name", widget: "string" }
      - { label: "Должность", name: "role", widget: "string" }
      - { label: "Фото", name: "image", widget: "image" }
      - label: "Социальные ссылки"
        name: "social"
        widget: "list"
        fields:
          - { label: "Иконка (fa-brands fa-xxx)", name: "icon", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }

  - name: "settings"
    label: "Настройки"
    files:
      - name: "hero"
        label: "Hero секция"
        file: "src/content/settings/hero.json"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Подзаголовок (параграф)", name: "subtitle", widget: "text" }
          - { label: "Текст первой кнопки", name: "btn1_text", widget: "string" }
          - { label: "Ссылка первой кнопки", name: "btn1_link", widget: "string" }
          - { label: "Текст второй кнопки", name: "btn2_text", widget: "string" }
          - { label: "Ссылка второй кнопки", name: "btn2_link", widget: "string" }
          - { label: "Изображение", name: "image", widget: "image" }
      - name: "contact"
        label: "Контакты"
        file: "src/content/settings/contact.json"
        fields:
          - { label: "Адрес", name: "address", widget: "string" }
          - { label: "Телефон", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }